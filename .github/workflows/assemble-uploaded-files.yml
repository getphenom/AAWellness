name: Assemble uploaded AA Wellness files

on:
  push:
    paths:
      - '.safe/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify uploaded files
        shell: bash
        run: |
          set -euo pipefail
          decode_list() {
            dst="$1"
            shift
            cat "$@" | base64 -d | gzip -dc > "$dst"
          }
          check_hash() {
            file="$1"
            expected="$2"
            actual="$(git hash-object "$file")"
            echo "$file: $actual"
            test "$actual" = "$expected" || { echo "Hash mismatch: $file ($actual != $expected)"; exit 1; }
          }

          decode_list 'AA - Cuatro Direcciones -bundle-src-.html' \
            .safe/f0-00.part \
            .safe/f0-01-x00-y00.part .safe/f0-01-x00-y01.part .safe/f0-01-x00-y02.part \
            .safe/f0-01-x00-y03-z00.part .safe/f0-01-x00-y03-z01.part \
            .safe/f0-01-x01.part .safe/f0-01-x02.part

          decode_list 'AA - Cuatro Direcciones.dc.html' \
            .safe/f1-00.part .safe/f1-01.part

          decode_list 'AA App - Nacar -bundle-src-.html' \
            .safe/f2-00.part .safe/f2-01-x00.part .safe/f2-01-x01.part \
            .safe/f2-01-x02-y00.part .safe/f2-01-x02-y01.part .safe/f2-01-x02-y02.part .safe/f2-01-x02-y03.part \
            .safe/f2-02.part

          decode_list 'AA App - Nacar.dc.html' \
            .safe/f3-00.part .safe/f3-01-x00.part .safe/f3-01-x01.part .safe/f3-01-x02.part .safe/f3-02.part

          decode_list 'AA Direccion 4 - Nacar.dc.html' \
            .safe/f4-00.part .safe/f4-01.part

          decode_list 'github.md' .safe/f5-00.part

          decode_list 'support.js' \
            .safe/f6-00.part .safe/f6-01.part .safe/f6-02.part .safe/f6-03.part .safe/f6-04.part

          check_hash 'AA - Cuatro Direcciones -bundle-src-.html' '50a92e11afaa5baa285333cd12db9e0ab1ae3121'
          check_hash 'AA - Cuatro Direcciones.dc.html' '560b69e3992003bd8e5b1e81e3ec3ef545053eb8'
          check_hash 'AA App - Nacar -bundle-src-.html' '05cbdfb1b75942b78d72636069f906698eb0e1cd'
          check_hash 'AA App - Nacar.dc.html' '6bb231b94b15b7f43c9f999aac8ce51688e8823e'
          check_hash 'AA Direccion 4 - Nacar.dc.html' '56492f0d4382dc6667984d1de7c05c71cda13b4c'
          check_hash 'AA Wellness - Cuatro Direcciones.html' '4fb9339fd572c5cd15d8147145276cc3fe5140ae'
          check_hash 'AA Wellness App - Nacar.html' '3fac622f3059e8baceb88d4f3f0f69ed6e5d13cb'
          check_hash 'github.md' 'd6f80af4c438f3dd71261074b0d31dbc82e1f5e8'
          check_hash 'support.js' 'cb009b69ec6b5e00f48c6287a587fe7e0c6c421b'

          rm -rf .safe .upload
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add uploaded AA Wellness source files'
          git push
