<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A&amp;A Wellness · Clínica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<link href="./css/app.css?v=202608152039" rel="stylesheet">
</head>
<body class="has-rail">

<span class="arc-top"></span>
<header class="topbar">
  <span class="brand">
    <img src="../assets/aa-logo.png" alt="" width="34" height="34"
         style="width:34px;height:34px;object-fit:contain"
         onerror="this.style.display='none'">
    <b>A&amp;A <span>CLÍNICA</span></b>
  </span>
  <span class="spacer"></span>
  <span class="who"><b id="who-name">…</b><span id="who-sub">Consola de la clínica</span></span>
  <button class="btn secondary sm" id="out">Salir</button>
</header>

<div class="shell">
  <aside class="rail">
    <div class="raillogo">
      <img src="../assets/aa-logo.png" alt="" width="42" height="42"
           style="width:42px;height:42px;object-fit:contain"
           onerror="this.style.display='none'">
      <em>A&amp;A<br>WELLNESS</em>
    </div>
    <ul id="railnav"></ul>
    <div class="booklink">
      <span>Enlace de reservas</span>
      <em>Comparte el portal con tus pacientes:<br><b id="booklink-url">…</b></em>
    </div>
  </aside>

  <main class="railmain" id="main">
    <div class="state"><span class="spinner"></span>Cargando la clínica…</div>
  </main>
</div>

<script type="module">
import { requireRole, signOut, getSession } from "./js/client.js?v=202608152039";
import * as slots from "./js/slots.js?v=202608152039";
import * as api from "./js/api.js?v=202608152039";
import { $, $$, esc, money, fmtDate, fmtDateTime, fmtTime, initials, openModal,
         closeModal, toast, loading, emptyState, errorState, bodyHtml,
         signatureHtml, STATUS_ES, STATUS_CLASS, dayKey, todayKey, monthLabel,
         longDate } from "./js/ui.js?v=202608152039";

const profile = await requireRole("staff");
if (!profile) throw new Error("redirecting");

$("#out").onclick = signOut;
$("#who-name").textContent = profile.full_name || profile.email;
$("#who-sub").textContent = profile.role === "owner" ? "Dueña" : "Personal";

const SECTIONS = [
  { id: "today",    label: "Hoy",        icon: "☀" },
  { id: "sched",    label: "Agenda",     icon: "▦" },
  { id: "patients", label: "Pacientes",  icon: "◉" },
  { id: "docs",     label: "Documentos", icon: "▤" },
  { id: "services", label: "Servicios",  icon: "✦" },
  { id: "inbox",    label: "Mensajes",   icon: "✉" },
  { id: "panel",    label: "Panel",      icon: "◑" }
];

let view = { name: "today", patientId: null, tab: "docs" };
let templates = [], services = [];
/* Badge counts on the rail (pending signatures, unread messages).
   Declared here, above every call site — `let` is not hoisted, so declaring
   it lower down puts paintNav() in the temporal dead zone and throws. */
let badges = { docs: 0, inbox: 0 };
/* Calendar state: which month the grid is showing, and which day is selected. */
let calRef = new Date();
let calSel = todayKey();
const main = $("#main");

try { [templates, services] = await Promise.all([api.listTemplates(), api.getServices()]); }
catch (e) { console.warn(e.message); }

paintNav();
route();
refreshBadges();

const portalUrl = new URL("./portal.html", location.href).href;
$("#booklink-url").textContent = portalUrl.replace(/^https?:\/\//, "");
$("#booklink-url").title = portalUrl;

function paintNav() {
  const active = view.name === "patient" ? "patients" : view.name;
  $("#railnav").innerHTML = SECTIONS.map((s) => {
    const n = badges[s.id] || 0;
    return `<li><button class="nav ${active === s.id ? "on" : ""}" data-nav="${s.id}">
      <span class="ico">${s.icon}</span><span class="lbl">${esc(s.label)}</span>
      ${n ? `<span class="dot">${n}</span>` : ""}</button></li>`;
  }).join("");
  $$("[data-nav]").forEach((b) => b.onclick = () => {
    view = { name: b.dataset.nav, patientId: null, tab: "docs" };
    paintNav(); route();
  });
}

/* Kept fresh so the rail reflects reality without a manual refresh. */
async function refreshBadges() {
  try {
    const { pendingDocs, unread } = await api.todaySnapshot();
    badges = { docs: pendingDocs.length, inbox: unread.length };
    paintNav();
  } catch (e) { /* badges are cosmetic — never block the view */ }
}

async function route() {
  main.innerHTML = loading();
  try {
    await ({
      today: viewToday, sched: viewSchedule, patients: viewPatients,
      patient: viewPatient, docs: viewDocs, services: viewServices,
      inbox: viewInbox, panel: viewPanel
    }[view.name])();
  } catch (e) {
    main.innerHTML = errorState("No se pudo cargar: " + e.message);
    console.error(e);
  }
  refreshBadges();
}

/* ============================================================== HOY ==== */
async function viewToday() {
  const { appts, pendingDocs, unread } = await api.todaySnapshot();
  const expected = appts.filter((a) => a.status !== "cancelled")
    .reduce((s, a) => s + (a.services?.price_cents || 0), 0);

  main.innerHTML = `
    <h2 style="margin-bottom:4px">Hoy</h2>
    <p class="lede">${esc(new Date().toLocaleDateString("es-PR",
      { weekday:"long", day:"numeric", month:"long", year:"numeric" }))}</p>

    <div class="grid grid-3" style="margin-bottom:16px">
      <div class="stat"><span>Citas de hoy</span><b>${appts.length}</b></div>
      <div class="stat"><span>Ingreso esperado</span><b>${money(expected)}</b></div>
      <div class="stat"><span>Firmas pendientes</span><b>${pendingDocs.length}</b></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>Citas de hoy</h3>
        <button class="btn sm" id="new-appt">+ Nueva cita</button></div>
      ${appts.length ? appts.map((a) => `<div class="row">
        <span class="pill">${esc(fmtTime(a.starts_at))}</span>
        <div class="main"><b>${esc(a.patients?.full_name || "Paciente")}</b>
          <span>${esc(a.services?.name || "Cita")} · ${a.minutes} min</span></div>
        <span class="pill ${a.status === "completed" ? "done" : ""}">${esc(a.status)}</span>
      </div>`).join("") : emptyState("No hay citas para hoy.")}
    </div>

    <div class="card">
      <div class="card-head"><h3>Documentos por firmar</h3></div>
      ${pendingDocs.length ? pendingDocs.slice(0, 8).map((d) =>
        `<div class="row click" data-goto="${esc(d.patient_id)}">
          <div class="main"><b>${esc(d.patients?.full_name || "Paciente")}</b>
            <span>${esc(d.title)}</span></div>
          <span class="pill ${STATUS_CLASS[d.status]}">${esc(STATUS_ES[d.status])}</span>
        </div>`).join("") : emptyState("Nada pendiente de firma ✓")}
    </div>

    <div class="card">
      <div class="card-head"><h3>Mensajes sin leer</h3></div>
      ${unread.length ? unread.slice(0, 8).map((m) =>
        `<div class="row click" data-msg="${esc(m.patient_id)}">
          <div class="main"><b>${esc(m.patients?.full_name || "Paciente")}</b>
            <span>${esc(m.body.slice(0, 80))}</span></div>
          <span class="pill todo">${esc(fmtDate(m.created_at))}</span>
        </div>`).join("") : emptyState("No hay mensajes sin leer.")}
    </div>`;

  $("#new-appt").onclick = () => apptModal();
  $$("[data-goto]").forEach((r) => r.onclick = () => {
    view = { name: "patient", patientId: r.dataset.goto, tab: "docs" }; paintNav(); route();
  });
  $$("[data-msg]").forEach((r) => r.onclick = () => {
    view = { name: "inbox", patientId: r.dataset.msg }; paintNav(); route();
  });
}

/* =========================================================== AGENDA ====
   Week grid of bookable slots, matching how the clinic actually books.
   Tap a slot to open or close it; patients only ever see the open ones.   */
async function viewSchedule() {
  const clinic = await api.getClinic();
  const schedule = clinic?.schedule || {};
  const slotMin = clinic?.slot_minutes || 45;

  const days = slots.weekDays(calRef);
  const from = new Date(days[0]); from.setHours(0, 0, 0, 0);
  const to   = new Date(days[6]); to.setHours(23, 59, 59, 999);

  const [overrides, appts] = await Promise.all([
    api.listOverrides(from.toISOString(), to.toISOString()),
    api.listAppointments(null, {})
  ]);

  const week = slots.buildWeek({
    anchor: calRef, schedule, slotMinutes: slotMin,
    overrides, appointments: appts
  });

  const open = week.cells.flat().filter((c) => c.state === "open" && !c.past).length;
  const booked = week.cells.flat().filter((c) => c.state === "booked").length;

  main.innerHTML = `
    <h2 style="margin-bottom:4px">Agenda</h2>
    <p class="lede">Toca un espacio para abrirlo o cerrarlo. Los pacientes solo
      ven los abiertos, y en cuanto alguien reserva, desaparece del enlace.</p>

    <div class="card">
      <div class="calbar">
        <button class="btn secondary sm" id="wk-prev" aria-label="Semana anterior">‹</button>
        <b>${esc(rangeLabel(days))}</b>
        <button class="btn secondary sm" id="wk-next" aria-label="Semana siguiente">›</button>
        <span style="flex:1"></span>
        <span class="pill done">${booked} reservadas</span>
        <span class="pill">${open} abiertas</span>
        <button class="btn secondary sm" id="wk-today">Hoy</button>
        <button class="btn sm" id="wk-add">+ Nueva cita</button>
      </div>

      <div class="slotwrap">
        <div class="slotgrid" style="grid-template-columns:64px repeat(7,minmax(96px,1fr))">
          <span class="slothead"></span>
          ${days.map((d) => `<span class="slothead${
            slots.dayKey(d) === todayKey() ? " is-today" : ""}">${
            esc(d.toLocaleDateString("es-PR", { weekday:"short", day:"numeric", month:"short" }))
          }</span>`).join("")}

          ${week.rows.map((mins, r) => `
            <span class="slottime">${esc(slots.minutesToLabel(mins))}</span>
            ${week.cells.map((col, c) => cellHtml(col[r], c, r)).join("")}
          `).join("")}
        </div>
      </div>
      <p class="hint" style="margin-top:10px">
        Rayado = cerrado · Crema = abierto · Blanco con borde = reservado
      </p>
    </div>`;

  $("#wk-prev").onclick  = () => { calRef = shiftWeek(calRef, -7); route(); };
  $("#wk-next").onclick  = () => { calRef = shiftWeek(calRef,  7); route(); };
  $("#wk-today").onclick = () => { calRef = new Date(); route(); };
  $("#wk-add").onclick   = () => apptModal();

  $$("[data-slot]").forEach((b) => b.onclick = () => onSlot(b.dataset.slot, b.dataset.state));

  function cellHtml(cell, c, r) {
    if (cell.state === "booked") {
      const a = cell.appointment;
      const name = (a.patients?.full_name || "Paciente").split(" ")[0];
      return `<button class="slot booked ${esc(a.status)}" data-slot="${esc(cell.iso)}"
        data-state="booked" title="${esc(a.services?.name || "Cita")}">${esc(name)}</button>`;
    }
    if (cell.state === "open") {
      return `<button class="slot open${cell.past ? " past" : ""}"
        data-slot="${esc(cell.iso)}" data-state="open">Abierto</button>`;
    }
    return `<button class="slot closed" data-slot="${esc(cell.iso)}" data-state="closed"></button>`;
  }

  async function onSlot(iso, state) {
    if (state === "booked") {
      const a = appts.find((x) => new Date(x.starts_at).getTime() === new Date(iso).getTime());
      if (a) return showAppt(a);
      return;
    }
    try {
      const s = await getSession();
      await api.setSlotOpen(iso, state !== "open", s?.user?.id);
      toast(state === "open" ? "Espacio cerrado." : "Espacio abierto.");
      route();
    } catch (e) { toast("No se pudo cambiar: " + e.message, "err"); }
  }
}

function shiftWeek(ref, delta) {
  const d = new Date(ref); d.setDate(d.getDate() + delta); return d;
}

function rangeLabel(days) {
  const a = days[0], b = days[6];
  const f = (d) => d.toLocaleDateString("es-PR", { day:"numeric", month:"short" });
  return `${f(a)} – ${f(b)}, ${b.getFullYear()}`;
}

function showAppt(a) {
  openModal(`
    <span class="kicker">${esc(fmtDateTime(a.starts_at))}</span>
    <h3>${esc(a.patients?.full_name || "Paciente")}</h3>
    <p class="lede">${esc(a.services?.name || "Cita")} · ${a.minutes} min</p>
    <div class="field"><label for="ap-st">Estado</label>
      <select id="ap-st">${["scheduled","confirmed","completed","cancelled","no_show"]
        .map((v) => `<option value="${v}" ${a.status===v?"selected":""}>${v}</option>`).join("")}
      </select></div>
    <div class="modal-actions">
      <button class="btn secondary" data-x>Cerrar</button>
      <button class="btn" id="ap-save">Guardar</button>
    </div>`);
  $$("[data-x]").forEach((b) => b.onclick = closeModal);
  $("#ap-save").onclick = async () => {
    try {
      await api.updateAppointment(a.id, { status: $("#ap-st").value });
      closeModal(); toast("Cita actualizada."); route();
    } catch (e) { toast("No se pudo guardar: " + e.message, "err"); }
  };
}

async function apptModal(patientId, dayISO) {
  const patients = await api.listPatients();
  if (!patients.length) { toast("Primero crea un paciente.", "err"); return; }
  openModal(`
    <h3>Nueva cita</h3>
    <div class="field"><label for="a-pt">Paciente</label>
      <select id="a-pt">${patients.map((p) =>
        `<option value="${esc(p.id)}" ${p.id===patientId?"selected":""}>${esc(p.full_name)}</option>`
      ).join("")}</select></div>
    <div class="field"><label for="a-svc">Servicio</label>
      <select id="a-svc"><option value="">— Ninguno —</option>${services.map((s) =>
        `<option value="${esc(s.id)}" data-min="${s.minutes}">${esc(s.name)} · ${money(s.price_cents)}</option>`
      ).join("")}</select></div>
    <div class="field"><label for="a-when">Fecha y hora</label>
      <input id="a-when" type="datetime-local"
             value="${dayISO ? dayISO + "T09:00" : ""}"></div>
    <div class="field"><label for="a-min">Duración (minutos)</label>
      <input id="a-min" type="number" min="5" step="5" value="30"></div>
    <div class="modal-actions">
      <button class="btn secondary" data-x>Cancelar</button>
      <button class="btn" id="a-save">Crear cita</button>
    </div>`);
  $$("[data-x]").forEach((b) => b.onclick = closeModal);

  $("#a-svc").onchange = (e) => {
    const m = e.target.selectedOptions[0]?.dataset.min;
    if (m) $("#a-min").value = m;
  };

  $("#a-save").onclick = async () => {
    const when = $("#a-when").value;
    if (!when) { $("#a-when").focus(); return; }
    const btn = $("#a-save"); btn.disabled = true; btn.textContent = "Guardando…";
    try {
      await api.createAppointment({
        patient_id: $("#a-pt").value,
        service_id: $("#a-svc").value || null,
        starts_at: new Date(when).toISOString(),
        minutes: Number($("#a-min").value) || 30
      });
      closeModal(); toast("Cita creada."); route();
    } catch (e) {
      toast("No se pudo crear: " + e.message, "err");
      btn.disabled = false; btn.textContent = "Crear cita";
    }
  };
}

/* ======================================================== PACIENTES ==== */
async function viewPatients() {
  const patients = await api.listPatients();
  main.innerHTML = `
    <h2 style="margin-bottom:4px">Pacientes</h2>
    <p class="lede">${patients.length} paciente${patients.length===1?"":"s"} activo${patients.length===1?"":"s"}.</p>
    <div class="card">
      <div class="card-head"><h3>Lista</h3>
        <button class="btn sm" id="add-patient">+ Nuevo paciente</button></div>
      <div class="field" style="margin-bottom:12px">
        <input id="search" type="search" placeholder="Buscar por nombre, teléfono o correo…">
      </div>
      <div id="plist">${patients.length ? rows(patients) : emptyState("Aún no hay pacientes.")}</div>
    </div>`;

  $("#add-patient").onclick = addPatient;
  $("#search").oninput = (e) => {
    const q = e.target.value.toLowerCase().trim();
    const hit = patients.filter((p) => [p.full_name, p.phone, p.email]
      .filter(Boolean).some((f) => f.toLowerCase().includes(q)));
    $("#plist").innerHTML = hit.length ? rows(hit) : emptyState("Sin resultados.");
    wireRows();
  };
  wireRows();

  function rows(list) {
    return list.map((p) => `<div class="row click" data-p="${esc(p.id)}">
      <span class="avatar">${esc(initials(p.full_name))}</span>
      <div class="main"><b>${esc(p.full_name)}</b>
        <span>${esc(p.phone || p.email || "Sin contacto")}${p.plan ? " · " + esc(p.plan) : ""}</span></div>
      ${p.profile_id ? '<span class="pill done">Cuenta activa</span>'
                     : '<span class="pill warn">Sin cuenta</span>'}
    </div>`).join("");
  }
  function wireRows() {
    $$("[data-p]").forEach((r) => r.onclick = () => {
      view = { name: "patient", patientId: r.dataset.p, tab: "docs" }; paintNav(); route();
    });
  }
}

async function addPatient() {
  openModal(`
    <h3>Nuevo paciente</h3>
    <p class="lede">Si escribes su correo, la cuenta se enlaza sola cuando esa
      persona se registre con el mismo correo.</p>
    <div class="field"><label for="n-name">Nombre completo</label>
      <input id="n-name" type="text" required></div>
    <div class="field"><label for="n-phone">Teléfono</label>
      <input id="n-phone" type="tel" placeholder="(787) 000-0000"></div>
    <div class="field"><label for="n-email">Correo electrónico</label>
      <input id="n-email" type="email" placeholder="paciente@correo.com"></div>
    <div class="field"><label for="n-plan">Plan</label>
      <input id="n-plan" type="text" placeholder="GLP-1, Drip Club…"></div>
    <div class="modal-actions">
      <button class="btn secondary" data-x>Cancelar</button>
      <button class="btn" id="n-save">Crear</button>
    </div>`);
  $$("[data-x]").forEach((b) => b.onclick = closeModal);
  $("#n-save").onclick = async () => {
    const full_name = $("#n-name").value.trim();
    if (!full_name) { $("#n-name").focus(); return; }
    const btn = $("#n-save"); btn.disabled = true; btn.textContent = "Guardando…";
    try {
      await api.createPatient({
        full_name,
        phone: $("#n-phone").value.trim() || null,
        email: $("#n-email").value.trim() || null,
        plan:  $("#n-plan").value.trim()  || null
      });
      closeModal(); toast("Paciente creado."); route();
    } catch (e) {
      toast("No se pudo crear: " + e.message, "err");
      btn.disabled = false; btn.textContent = "Crear";
    }
  };
}

/* ================================================ PERFIL DEL PACIENTE == */
async function viewPatient() {
  const p = await api.getPatient(view.patientId);
  const [docs, visits, appts, msgs] = await Promise.all([
    api.listDocuments(p.id), api.listVisits(p.id),
    api.listAppointments(p.id), api.listMessages(p.id)
  ]);
  const pending = docs.filter((d) => d.status === "pending" || d.status === "accepted").length;

  main.innerHTML = `
    <button class="btn ghost" id="back" style="margin-bottom:12px">← Pacientes</button>
    <div class="card">
      <div class="card-head">
        <span class="avatar">${esc(initials(p.full_name))}</span>
        <div style="flex:1">
          <h3>${esc(p.full_name)}</h3>
          <span class="muted" style="font-size:12px">${esc(p.phone || p.email || "Sin contacto")}${
            p.plan ? " · " + esc(p.plan) : ""}</span>
        </div>
        ${p.profile_id ? '<span class="pill done">Cuenta activa</span>'
                       : '<span class="pill warn">Sin cuenta</span>'}
      </div>
      <div class="grid grid-3">
        <div class="stat"><span>Documentos</span><b>${docs.length}</b></div>
        <div class="stat"><span>Pendientes</span><b>${pending}</b></div>
        <div class="stat"><span>Visitas</span><b>${visits.length}</b></div>
      </div>
    </div>
    <div class="tabs" id="ptabs">
      <button data-t="docs"   class="${view.tab==='docs'?'on':''}">Documentos</button>
      <button data-t="visits" class="${view.tab==='visits'?'on':''}">Visitas</button>
      <button data-t="appts"  class="${view.tab==='appts'?'on':''}">Citas</button>
      <button data-t="msgs"   class="${view.tab==='msgs'?'on':''}">Mensajes</button>
    </div>
    <div class="card" id="panel"></div>`;

  $("#back").onclick = () => { view = { name: "patients" }; paintNav(); route(); };
  $$("#ptabs button").forEach((b) => b.onclick = () => { view.tab = b.dataset.t; paint(); });
  paint();

  function paint() {
    const panel = $("#panel");
    if (view.tab === "docs") {
      panel.innerHTML = `<div class="card-head"><h3>Documentos</h3>
        <button class="btn sm" id="assign">+ Añadir documento</button></div>
        ${docs.length ? docs.map(docRow).join("") : emptyState("Sin documentos todavía.")}`;
      $("#assign").onclick = () => assignDoc(p);
      $$("[data-doc]").forEach((b) => b.onclick = () => showDoc(b.dataset.doc));
    }
    if (view.tab === "visits") {
      panel.innerHTML = `<div class="card-head"><h3>Visitas</h3>
        <button class="btn sm" id="add-visit">+ Añadir visita</button></div>
        ${visits.length ? visits.map((v) => `<div class="row">
          <div class="main"><b>${esc(v.title)}</b>
            <span>${esc(fmtDate(v.occurred_at))}${v.notes ? " · " + esc(v.notes) : ""}</span></div>
          ${v.metric ? `<span class="pill">${esc(v.metric)}</span>` : ""}
        </div>`).join("") : emptyState("Sin visitas registradas.")}`;
      $("#add-visit").onclick = () => addVisit(p);
    }
    if (view.tab === "appts") {
      panel.innerHTML = `<div class="card-head"><h3>Citas</h3>
        <button class="btn sm" id="pa">+ Nueva cita</button></div>
        ${appts.length ? appts.map((a) => `<div class="row">
          <span class="pill">${esc(fmtDateTime(a.starts_at))}</span>
          <div class="main"><b>${esc(a.services?.name || "Cita")}</b><span>${a.minutes} min</span></div>
          <span class="pill">${esc(a.status)}</span>
        </div>`).join("") : emptyState("Sin citas.")}`;
      $("#pa").onclick = () => apptModal(p.id);
    }
    if (view.tab === "msgs") {
      panel.innerHTML = `<div class="card-head"><h3>Mensajes</h3></div>
        <div class="thread">${msgs.length ? msgs.map((m) => `
          <div class="bubble ${m.from_clinic ? "mine" : "theirs"}">
            <p>${esc(m.body)}</p><span>${esc(fmtDateTime(m.created_at))}</span>
          </div>`).join("") : emptyState("Sin mensajes todavía.")}</div>
        <div class="field" style="margin-top:12px">
          <textarea id="msg-body" rows="3" placeholder="Escribe un mensaje…"></textarea></div>
        <button class="btn" id="msg-send">Enviar</button>`;
      $("#msg-send").onclick = async () => {
        const body = $("#msg-body").value.trim();
        if (!body) return;
        try {
          const s = await getSession();
          await api.sendMessage(p.id, body, true, s?.user?.id);
          toast("Mensaje enviado."); route();
        } catch (e) { toast("No se pudo enviar: " + e.message, "err"); }
      };
    }
  }

  function docRow(d) {
    const sub = d.status === "signed" && d.signatures?.length
      ? "Firmado " + fmtDate(d.completed_at)
      : (d.requires_signature ? "Requiere firma" : "Solo lectura");
    return `<div class="row">
      <div class="main"><b>${esc(d.title)}</b><span>${esc(sub)}</span></div>
      <span class="pill ${STATUS_CLASS[d.status]}">${esc(STATUS_ES[d.status])}</span>
      <button class="btn secondary sm" data-doc="${esc(d.id)}">Ver</button>
    </div>`;
  }
}

/* ======================================================= DOCUMENTOS ==== */
async function viewDocs() {
  const docs = await api.listAllDocuments();
  const counts = {
    all: docs.length,
    pending: docs.filter((d) => d.status === "pending" || d.status === "accepted").length,
    signed: docs.filter((d) => d.status === "signed").length,
    filed: docs.filter((d) => d.status === "filed").length
  };
  let filter = "all";

  main.innerHTML = `
    <h2 style="margin-bottom:4px">Documentos</h2>
    <p class="lede">Todos los documentos de la clínica, de todos los pacientes.</p>
    <div class="grid grid-3" style="margin-bottom:16px">
      <div class="stat"><span>Total</span><b>${counts.all}</b></div>
      <div class="stat"><span>Por firmar</span><b>${counts.pending}</b></div>
      <div class="stat"><span>Firmados</span><b>${counts.signed}</b></div>
    </div>
    <div class="card">
      <div class="tabs" id="dfilter">
        <button data-f="all" class="on">Todos (${counts.all})</button>
        <button data-f="pending">Por firmar (${counts.pending})</button>
        <button data-f="signed">Firmados (${counts.signed})</button>
        <button data-f="filed">En archivo (${counts.filed})</button>
      </div>
      <div id="dlist"></div>
    </div>`;

  const paint = () => {
    const list = docs.filter((d) =>
      filter === "all" ? true
      : filter === "pending" ? (d.status === "pending" || d.status === "accepted")
      : d.status === filter);
    $("#dlist").innerHTML = list.length ? list.map((d) => `<div class="row">
      <div class="main"><b>${esc(d.patients?.full_name || "Paciente")}</b>
        <span>${esc(d.title)} · ${esc(fmtDate(d.assigned_at))}</span></div>
      <span class="pill ${STATUS_CLASS[d.status]}">${esc(STATUS_ES[d.status])}</span>
      <button class="btn secondary sm" data-doc="${esc(d.id)}">Ver</button>
    </div>`).join("") : emptyState("Nada en esta categoría.");
    $$("[data-doc]").forEach((b) => b.onclick = () => showDoc(b.dataset.doc));
  };
  paint();

  $$("#dfilter button").forEach((b) => b.onclick = () => {
    $$("#dfilter button").forEach((x) => x.classList.toggle("on", x === b));
    filter = b.dataset.f; paint();
  });
}

async function assignDoc(p) {
  const opts = templates.map((t) =>
    `<option value="${esc(t.slug)}">${esc(t.title)}</option>`).join("");
  openModal(`
    <h3>Añadir documento</h3>
    <p class="lede">El paciente lo verá como pendiente en su portal.</p>
    <div class="field"><label for="tpl">Plantilla</label>
      <select id="tpl">${opts}<option value="__custom">— Escribir uno nuevo —</option></select></div>
    <div id="custom" style="display:none">
      <div class="field"><label for="c-title">Título</label>
        <input id="c-title" type="text" placeholder="Título del documento"></div>
      <div class="field"><label for="c-body">Contenido</label>
        <textarea id="c-body" rows="7" placeholder="Texto que el paciente debe leer…"></textarea></div>
    </div>
    <label class="check"><input type="checkbox" id="needsig" checked>
      Requiere firma del paciente</label>
    <div class="modal-actions">
      <button class="btn secondary" data-x>Cancelar</button>
      <button class="btn" id="a-save">Asignar</button>
    </div>`);

  $$("[data-x]").forEach((b) => b.onclick = closeModal);
  const sel = $("#tpl"), custom = $("#custom"), needsig = $("#needsig");
  const sync = () => {
    const isCustom = sel.value === "__custom";
    custom.style.display = isCustom ? "block" : "none";
    if (!isCustom) {
      const t = templates.find((x) => x.slug === sel.value);
      if (t) needsig.checked = t.requires_signature;
    }
  };
  sel.onchange = sync; sync();

  $("#a-save").onclick = async () => {
    const btn = $("#a-save"); btn.disabled = true; btn.textContent = "Guardando…";
    try {
      const session = await getSession();
      if (sel.value === "__custom") {
        const title = $("#c-title").value.trim();
        if (!title) { $("#c-title").focus(); btn.disabled = false; btn.textContent = "Asignar"; return; }
        await api.createDocument({
          patient_id: p.id, title, kind: "form",
          body: $("#c-body").value.trim(),
          requires_signature: needsig.checked,
          assigned_by: session?.user?.id
        });
      } else {
        const t = templates.find((x) => x.slug === sel.value);
        await api.assignTemplate(p.id, { ...t, requires_signature: needsig.checked },
          session?.user?.id);
      }
      closeModal(); toast("Documento asignado."); route();
    } catch (e) {
      toast("No se pudo asignar: " + e.message, "err");
      btn.disabled = false; btn.textContent = "Asignar";
    }
  };
}

/* Read-only. Staff must never be able to sign on a patient's behalf. */
async function showDoc(id) {
  const doc = await api.getDocument(id);
  const sig = doc.signatures?.[0];
  openModal(`
    <span class="kicker">${esc(STATUS_ES[doc.status] || "Documento")}</span>
    <h3>${esc(doc.title)}</h3>
    <div class="doc-body">${bodyHtml(doc)}${signatureHtml(sig)}</div>
    ${sig ? "" : '<p class="lede">Aún sin firmar por el paciente.</p>'}
    <div class="modal-actions"><button class="btn secondary" data-x>Cerrar</button></div>`);
  $$("[data-x]").forEach((b) => b.onclick = closeModal);
}

async function addVisit(p) {
  openModal(`
    <h3>Añadir visita</h3>
    <div class="field"><label for="v-title">Título</label>
      <input id="v-title" type="text" placeholder="Seguimiento semana 4"></div>
    <div class="field"><label for="v-date">Fecha</label>
      <input id="v-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label for="v-metric">Medida (opcional)</label>
      <input id="v-metric" type="text" placeholder="179.8 lb"></div>
    <div class="field"><label for="v-notes">Notas</label>
      <textarea id="v-notes" rows="4"></textarea></div>
    <div class="modal-actions">
      <button class="btn secondary" data-x>Cancelar</button>
      <button class="btn" id="v-save">Guardar</button>
    </div>`);
  $$("[data-x]").forEach((b) => b.onclick = closeModal);
  $("#v-save").onclick = async () => {
    const title = $("#v-title").value.trim();
    if (!title) { $("#v-title").focus(); return; }
    const btn = $("#v-save"); btn.disabled = true; btn.textContent = "Guardando…";
    try {
      const session = await getSession();
      await api.createVisit({
        patient_id: p.id, title,
        occurred_at: $("#v-date").value,
        metric: $("#v-metric").value.trim() || null,
        notes:  $("#v-notes").value.trim()  || null,
        created_by: session?.user?.id
      });
      closeModal(); toast("Visita guardada."); route();
    } catch (e) {
      toast("No se pudo guardar: " + e.message, "err");
      btn.disabled = false; btn.textContent = "Guardar";
    }
  };
}

/* ========================================================= MENSAJES ==== */
async function viewInbox() {
  const [patients, all] = await Promise.all([api.listPatients(), api.listMessages()]);
  const byPatient = {};
  for (const m of all) (byPatient[m.patient_id] = byPatient[m.patient_id] || []).push(m);

  const withMsgs = patients.filter((p) => byPatient[p.id]?.length);
  const selected = view.patientId || withMsgs[0]?.id || patients[0]?.id || null;

  main.innerHTML = `
    <h2 style="margin-bottom:4px">Mensajes</h2>
    <p class="lede">Conversaciones con pacientes. Solo tú y ese paciente las ven.</p>
    ${!patients.length ? emptyState("Aún no hay pacientes.") : `
    <div class="grid grid-2">
      <div class="card">
        <div class="card-head"><h3>Conversaciones</h3></div>
        ${patients.map((p) => {
          const msgs = byPatient[p.id] || [];
          const last = msgs[msgs.length - 1];
          const unread = msgs.filter((m) => !m.from_clinic && !m.read_at).length;
          return `<div class="row click ${p.id===selected?"sel":""}" data-t="${esc(p.id)}">
            <span class="avatar">${esc(initials(p.full_name))}</span>
            <div class="main"><b>${esc(p.full_name)}</b>
              <span>${esc(last ? last.body.slice(0,44) : "Sin mensajes")}</span></div>
            ${unread ? `<span class="pill todo">${unread}</span>` : ""}
          </div>`;
        }).join("")}
      </div>
      <div class="card" id="thread"></div>
    </div>`}`;

  $$("[data-t]").forEach((r) => r.onclick = () => { view.patientId = r.dataset.t; route(); });
  if (selected) paintThread(selected, byPatient[selected] || [], patients);

  async function paintThread(pid, msgs, list) {
    const p = list.find((x) => x.id === pid);
    $("#thread").innerHTML = `
      <div class="card-head"><h3>${esc(p?.full_name || "Paciente")}</h3></div>
      <div class="thread">${msgs.length ? msgs.map((m) => `
        <div class="bubble ${m.from_clinic ? "mine" : "theirs"}">
          <p>${esc(m.body)}</p><span>${esc(fmtDateTime(m.created_at))}</span>
        </div>`).join("") : emptyState("Sin mensajes todavía.")}</div>
      <div class="field" style="margin-top:12px">
        <textarea id="ib-body" rows="3" placeholder="Escribe un mensaje…"></textarea></div>
      <button class="btn" id="ib-send">Enviar</button>`;

    const unread = msgs.filter((m) => !m.from_clinic && !m.read_at).map((m) => m.id);
    if (unread.length) { try { await api.markMessagesRead(unread); } catch (e) {} }

    $("#ib-send").onclick = async () => {
      const body = $("#ib-body").value.trim();
      if (!body) return;
      try {
        const s = await getSession();
        await api.sendMessage(pid, body, true, s?.user?.id);
        toast("Mensaje enviado."); route();
      } catch (e) { toast("No se pudo enviar: " + e.message, "err"); }
    };
  }
}

/* ========================================================= SERVICIOS === */
async function viewServices() {
  services = await api.getServices();
  main.innerHTML = `
    <h2 style="margin-bottom:4px">Servicios</h2>
    <p class="lede">Precios y enlaces de pago de Clover. Se reflejan en el portal del paciente.</p>
    <div class="card">
      ${services.map((s) => `<div class="row">
        <div class="main"><b>${esc(s.name)}</b>
          <span>${esc(s.description || "")} · ${s.minutes} min</span></div>
        <span class="pill">${money(s.price_cents)}</span>
        <span class="pill ${s.clover_link ? "done" : "warn"}">${
          s.clover_link ? "Clover ✓" : "Sin Clover"}</span>
        <button class="btn secondary sm" data-svc="${esc(s.id)}">Editar</button>
      </div>`).join("")}
    </div>`;
  $$("[data-svc]").forEach((b) => b.onclick = () =>
    editService(services.find((x) => x.id === b.dataset.svc)));
}

async function editService(s) {
  openModal(`
    <h3>${esc(s.name)}</h3>
    <div class="field"><label for="s-price">Precio (USD)</label>
      <input id="s-price" type="number" min="0" step="1" value="${Math.round(s.price_cents/100)}"></div>
    <div class="field"><label for="s-mins">Duración (minutos)</label>
      <input id="s-mins" type="number" min="5" step="5" value="${s.minutes}"></div>
    <div class="field"><label for="s-clover">Enlace de pago de Clover</label>
      <input id="s-clover" type="url" value="${esc(s.clover_link || "")}" placeholder="https://…">
      <span class="hint">Créalo en tu panel de Clover y pégalo aquí. Sin enlace,
        el paciente ve “Pagar en clínica”.</span></div>
    <div class="modal-actions">
      <button class="btn secondary" data-x>Cancelar</button>
      <button class="btn" id="s-save">Guardar</button>
    </div>`);
  $$("[data-x]").forEach((b) => b.onclick = closeModal);
  $("#s-save").onclick = async () => {
    const btn = $("#s-save"); btn.disabled = true; btn.textContent = "Guardando…";
    try {
      await api.saveService(s.id, {
        price_cents: Math.round(Number($("#s-price").value) * 100),
        minutes: Number($("#s-mins").value),
        clover_link: $("#s-clover").value.trim() || null
      });
      closeModal(); toast("Servicio actualizado."); route();
    } catch (e) {
      toast("No se pudo guardar: " + e.message, "err");
      btn.disabled = false; btn.textContent = "Guardar";
    }
  };
}

/* ============================================================= PANEL === */
async function viewPanel() {
  const s = await api.dashboardStats();
  const svc = Object.entries(s.byService).sort((a, b) => b[1] - a[1]);
  const max = svc.length ? svc[0][1] : 1;

  main.innerHTML = `
    <h2 style="margin-bottom:4px">Panel</h2>
    <p class="lede">Resumen de los últimos 30 días.</p>

    <div class="grid grid-3" style="margin-bottom:16px">
      <div class="stat"><span>Pacientes activos</span><b>${s.patients}</b></div>
      <div class="stat"><span>Nuevos (30 d)</span><b>${s.newPatients}</b></div>
      <div class="stat"><span>Visitas (30 d)</span><b>${s.visits30}</b></div>
      <div class="stat"><span>Citas próximas</span><b>${s.upcoming}</b></div>
      <div class="stat"><span>Ingreso esperado</span><b>${money(s.expectedCents)}</b></div>
      <div class="stat"><span>Firmas pendientes</span><b>${s.docsPending}</b></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>Documentos</h3></div>
      <div class="grid grid-3">
        <div class="stat"><span>Total</span><b>${s.docsTotal}</b></div>
        <div class="stat"><span>Firmados</span><b>${s.docsSigned}</b></div>
        <div class="stat"><span>Por firmar</span><b>${s.docsPending}</b></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>Servicios más usados (30 d)</h3></div>
      ${svc.length ? svc.map(([name, n]) => `
        <div class="barrow">
          <span class="barlabel">${esc(name)}</span>
          <span class="bartrack"><i style="width:${Math.round(n / max * 100)}%"></i></span>
          <span class="barval">${n}</span>
        </div>`).join("") : emptyState("Aún no hay visitas registradas.")}
    </div>

    <div class="banner warn">
      <b>“Ingreso esperado” es una estimación</b>
      Suma el precio de lista de las citas próximas. No es dinero cobrado — la
      app todavía no registra pagos de Clover.
    </div>`;
}
