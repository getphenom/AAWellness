<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A&amp;A Wellness · Clínica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<link href="./css/app.css" rel="stylesheet">
</head>
<body>

<span class="arc-top"></span>
<header class="topbar">
  <span class="brand">
    <img src="../assets/aa-logo.png" alt="" onerror="this.style.display='none'">
    <b>A&amp;A <span>CLÍNICA</span></b>
  </span>
  <span class="spacer"></span>
  <span class="who"><b id="who-name">…</b><span id="who-sub">Consola de la clínica</span></span>
  <button class="btn secondary sm" id="out">Salir</button>
</header>

<main class="wrap" id="main">
  <div class="state"><span class="spinner"></span>Cargando la clínica…</div>
</main>

<script type="module">
import { requireRole, signOut, getSession } from "./js/client.js";
import * as api from "./js/api.js";
import { $, $$, esc, money, fmtDate, fmtDateTime, initials, openModal, closeModal,
         toast, loading, emptyState, errorState, bodyHtml, signatureHtml,
         STATUS_ES, STATUS_CLASS } from "./js/ui.js";

const profile = await requireRole("staff");
if (!profile) throw new Error("redirecting");

$("#out").onclick = signOut;
$("#who-name").textContent = profile.full_name || profile.email;
$("#who-sub").textContent = profile.role === "owner" ? "Dueña" : "Personal";

const main = $("#main");
let view = { name: "patients", patientId: null, tab: "docs" };
let templates = [];

try { templates = await api.listTemplates(); }
catch (e) { console.warn("templates:", e.message); }

route();

/* ------------------------------------------------------------- routing */
async function route() {
  main.innerHTML = loading();
  try {
    if (view.name === "patients") await viewPatients();
    else if (view.name === "patient") await viewPatient();
    else if (view.name === "services") await viewServices();
  } catch (e) {
    main.innerHTML = errorState("No se pudo cargar: " + e.message);
  }
}

function nav() {
  return `<div class="tabs" style="margin-bottom:18px">
    <button class="${view.name!=='services'?'on':''}" data-nav="patients">Pacientes</button>
    <button class="${view.name==='services'?'on':''}" data-nav="services">Servicios</button>
  </div>`;
}
function wireNav() {
  $$("[data-nav]").forEach((b) => b.onclick = () => {
    view = { name: b.dataset.nav, patientId: null, tab: "docs" }; route();
  });
}

/* ------------------------------------------------------ patient list */
async function viewPatients() {
  const patients = await api.listPatients();
  main.innerHTML = `${nav()}
    <div class="card">
      <div class="card-head">
        <h3>Pacientes</h3>
        <button class="btn sm" id="add-patient">+ Nuevo paciente</button>
      </div>
      <div class="field" style="margin-bottom:12px">
        <input id="search" type="search" placeholder="Buscar por nombre, teléfono o correo…">
      </div>
      <div id="plist">${patients.length ? rows(patients) : emptyState("Aún no hay pacientes.")}</div>
    </div>`;

  wireNav();
  $("#add-patient").onclick = addPatient;

  $("#search").oninput = (e) => {
    const q = e.target.value.toLowerCase().trim();
    const hit = patients.filter((p) =>
      [p.full_name, p.phone, p.email].filter(Boolean)
        .some((f) => f.toLowerCase().includes(q)));
    $("#plist").innerHTML = hit.length ? rows(hit) : emptyState("Sin resultados.");
    wireRows();
  };
  wireRows();

  function rows(list) {
    return list.map((p) => `<div class="row click" data-p="${esc(p.id)}">
      <span class="avatar">${esc(initials(p.full_name))}</span>
      <div class="main"><b>${esc(p.full_name)}</b>
        <span>${esc(p.phone || p.email || "Sin contacto")}${
          p.plan ? " · " + esc(p.plan) : ""}</span></div>
      ${p.profile_id
        ? '<span class="pill done">Cuenta activa</span>'
        : '<span class="pill warn">Sin cuenta</span>'}
    </div>`).join("");
  }
  function wireRows() {
    $$("[data-p]").forEach((r) => r.onclick = () => {
      view = { name: "patient", patientId: r.dataset.p, tab: "docs" }; route();
    });
  }
}

async function addPatient() {
  openModal(`
    <h3>Nuevo paciente</h3>
    <p class="lede">Si escribes su correo, la cuenta se enlaza sola cuando esa
      persona se registre con el mismo correo.</p>
    <div class="field"><label for="n-name">Nombre completo</label>
      <input id="n-name" type="text" required></div>
    <div class="field"><label for="n-phone">Teléfono</label>
      <input id="n-phone" type="tel" placeholder="(787) 000-0000"></div>
    <div class="field"><label for="n-email">Correo electrónico</label>
      <input id="n-email" type="email" placeholder="paciente@correo.com"></div>
    <div class="field"><label for="n-plan">Plan</label>
      <input id="n-plan" type="text" placeholder="GLP-1, Drip Club…"></div>
    <div class="modal-actions">
      <button class="btn secondary" data-x>Cancelar</button>
      <button class="btn" id="n-save">Crear</button>
    </div>`);
  $$("[data-x]").forEach((b) => b.onclick = closeModal);
  $("#n-save").onclick = async () => {
    const full_name = $("#n-name").value.trim();
    if (!full_name) { $("#n-name").focus(); return; }
    const btn = $("#n-save"); btn.disabled = true; btn.textContent = "Guardando…";
    try {
      await api.createPatient({
        full_name,
        phone: $("#n-phone").value.trim() || null,
        email: $("#n-email").value.trim() || null,
        plan:  $("#n-plan").value.trim()  || null
      });
      closeModal(); toast("Paciente creado."); route();
    } catch (e) {
      toast("No se pudo crear: " + e.message, "err");
      btn.disabled = false; btn.textContent = "Crear";
    }
  };
}

/* --------------------------------------------------- patient profile */
async function viewPatient() {
  const p = await api.getPatient(view.patientId);
  const [docs, visits, appts] = await Promise.all([
    api.listDocuments(p.id), api.listVisits(p.id), api.listAppointments(p.id)
  ]);
  const pending = docs.filter((d) => d.status === "pending" || d.status === "accepted").length;

  main.innerHTML = `
    <button class="btn ghost" id="back" style="margin-bottom:12px">← Pacientes</button>
    <div class="card">
      <div class="card-head">
        <span class="avatar">${esc(initials(p.full_name))}</span>
        <div style="flex:1">
          <h3>${esc(p.full_name)}</h3>
          <span class="muted" style="font-size:12px">${esc(p.phone || p.email || "Sin contacto")}${
            p.plan ? " · " + esc(p.plan) : ""}</span>
        </div>
        ${p.profile_id ? '<span class="pill done">Cuenta activa</span>'
                       : '<span class="pill warn">Sin cuenta</span>'}
      </div>
      <div class="grid grid-3">
        <div class="stat"><span>Documentos</span><b>${docs.length}</b></div>
        <div class="stat"><span>Pendientes</span><b>${pending}</b></div>
        <div class="stat"><span>Visitas</span><b>${visits.length}</b></div>
      </div>
    </div>

    <div class="tabs" id="ptabs">
      <button data-t="docs"   class="${view.tab==='docs'?'on':''}">Documentos</button>
      <button data-t="visits" class="${view.tab==='visits'?'on':''}">Visitas</button>
      <button data-t="appts"  class="${view.tab==='appts'?'on':''}">Citas</button>
    </div>
    <div class="card" id="panel"></div>`;

  $("#back").onclick = () => { view = { name: "patients" }; route(); };
  $$("#ptabs button").forEach((b) => b.onclick = () => { view.tab = b.dataset.t; paint(); });
  paint();

  function paint() {
    const panel = $("#panel");
    if (view.tab === "docs") {
      panel.innerHTML = `<div class="card-head"><h3>Documentos</h3>
          <button class="btn sm" id="assign">+ Añadir documento</button></div>
        ${docs.length ? docs.map(docRow).join("") : emptyState("Sin documentos todavía.")}`;
      $("#assign").onclick = () => assignDoc(p);
      $$("[data-doc]").forEach((b) => b.onclick = () => showDoc(b.dataset.doc));
    }
    if (view.tab === "visits") {
      panel.innerHTML = `<div class="card-head"><h3>Visitas</h3>
          <button class="btn sm" id="add-visit">+ Añadir visita</button></div>
        ${visits.length ? visits.map((v) => `<div class="row">
          <div class="main"><b>${esc(v.title)}</b>
            <span>${esc(fmtDate(v.occurred_at))}${v.notes ? " · " + esc(v.notes) : ""}</span></div>
          ${v.metric ? `<span class="pill">${esc(v.metric)}</span>` : ""}
        </div>`).join("") : emptyState("Sin visitas registradas.")}`;
      $("#add-visit").onclick = () => addVisit(p);
    }
    if (view.tab === "appts") {
      panel.innerHTML = `<div class="card-head"><h3>Citas</h3></div>
        ${appts.length ? appts.map((a) => `<div class="row">
          <div class="main"><b>${esc(a.services?.name || "Cita")}</b>
            <span>${esc(fmtDateTime(a.starts_at))} · ${a.minutes} min</span></div>
          <span class="pill">${esc(a.status)}</span>
        </div>`).join("") : emptyState("Sin citas.")}`;
    }
  }

  function docRow(d) {
    const sub = d.status === "signed" && d.signatures?.length
      ? "Firmado " + fmtDate(d.completed_at)
      : (d.requires_signature ? "Requiere firma" : "Solo lectura");
    return `<div class="row">
      <div class="main"><b>${esc(d.title)}</b><span>${esc(sub)}</span></div>
      <span class="pill ${STATUS_CLASS[d.status]}">${esc(STATUS_ES[d.status])}</span>
      <button class="btn secondary sm" data-doc="${esc(d.id)}">Ver</button>
    </div>`;
  }
}

async function assignDoc(p) {
  const opts = templates.map((t) =>
    `<option value="${esc(t.slug)}">${esc(t.title)}</option>`).join("");
  openModal(`
    <h3>Añadir documento</h3>
    <p class="lede">El paciente lo verá como pendiente en su portal.</p>
    <div class="field"><label for="tpl">Plantilla</label>
      <select id="tpl">${opts}<option value="__custom">— Escribir uno nuevo —</option></select></div>
    <div id="custom" style="display:none">
      <div class="field"><label for="c-title">Título</label>
        <input id="c-title" type="text" placeholder="Título del documento"></div>
      <div class="field"><label for="c-body">Contenido</label>
        <textarea id="c-body" rows="7" placeholder="Texto que el paciente debe leer…"></textarea></div>
    </div>
    <label class="check"><input type="checkbox" id="needsig" checked>
      Requiere firma del paciente</label>
    <div class="modal-actions">
      <button class="btn secondary" data-x>Cancelar</button>
      <button class="btn" id="a-save">Asignar</button>
    </div>`);

  $$("[data-x]").forEach((b) => b.onclick = closeModal);
  const sel = $("#tpl"), custom = $("#custom"), needsig = $("#needsig");
  const sync = () => {
    const isCustom = sel.value === "__custom";
    custom.style.display = isCustom ? "block" : "none";
    if (!isCustom) {
      const t = templates.find((x) => x.slug === sel.value);
      if (t) needsig.checked = t.requires_signature;
    }
  };
  sel.onchange = sync; sync();

  $("#a-save").onclick = async () => {
    const btn = $("#a-save"); btn.disabled = true; btn.textContent = "Guardando…";
    try {
      const session = await getSession();
      if (sel.value === "__custom") {
        const title = $("#c-title").value.trim();
        if (!title) { $("#c-title").focus(); btn.disabled = false; btn.textContent = "Asignar"; return; }
        await api.createDocument({
          patient_id: p.id, title, kind: "form",
          body: $("#c-body").value.trim(),
          requires_signature: needsig.checked,
          assigned_by: session?.user?.id
        });
      } else {
        const t = templates.find((x) => x.slug === sel.value);
        await api.assignTemplate(p.id,
          { ...t, requires_signature: needsig.checked }, session?.user?.id);
      }
      closeModal(); toast("Documento asignado."); route();
    } catch (e) {
      toast("No se pudo asignar: " + e.message, "err");
      btn.disabled = false; btn.textContent = "Asignar";
    }
  };
}

/* Clinic view of a document is deliberately read-only — staff must never be
   able to sign on a patient's behalf. */
async function showDoc(id) {
  const doc = await api.getDocument(id);
  const sig = doc.signatures?.[0];
  openModal(`
    <span class="kicker">${esc(STATUS_ES[doc.status] || "Documento")}</span>
    <h3>${esc(doc.title)}</h3>
    <div class="doc-body">${bodyHtml(doc)}${signatureHtml(sig)}</div>
    ${sig ? "" : '<p class="lede">Aún sin firmar por el paciente.</p>'}
    <div class="modal-actions"><button class="btn secondary" data-x>Cerrar</button></div>`);
  $$("[data-x]").forEach((b) => b.onclick = closeModal);
}

async function addVisit(p) {
  openModal(`
    <h3>Añadir visita</h3>
    <div class="field"><label for="v-title">Título</label>
      <input id="v-title" type="text" placeholder="Seguimiento semana 4"></div>
    <div class="field"><label for="v-date">Fecha</label>
      <input id="v-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label for="v-metric">Medida (opcional)</label>
      <input id="v-metric" type="text" placeholder="179.8 lb"></div>
    <div class="field"><label for="v-notes">Notas</label>
      <textarea id="v-notes" rows="4"></textarea></div>
    <div class="modal-actions">
      <button class="btn secondary" data-x>Cancelar</button>
      <button class="btn" id="v-save">Guardar</button>
    </div>`);
  $$("[data-x]").forEach((b) => b.onclick = closeModal);
  $("#v-save").onclick = async () => {
    const title = $("#v-title").value.trim();
    if (!title) { $("#v-title").focus(); return; }
    const btn = $("#v-save"); btn.disabled = true; btn.textContent = "Guardando…";
    try {
      const session = await getSession();
      await api.createVisit({
        patient_id: p.id, title,
        occurred_at: $("#v-date").value,
        metric: $("#v-metric").value.trim() || null,
        notes:  $("#v-notes").value.trim()  || null,
        created_by: session?.user?.id
      });
      closeModal(); toast("Visita guardada."); route();
    } catch (e) {
      toast("No se pudo guardar: " + e.message, "err");
      btn.disabled = false; btn.textContent = "Guardar";
    }
  };
}

/* ------------------------------------------------------------ services */
async function viewServices() {
  const services = await api.getServices();
  main.innerHTML = `${nav()}
    <div class="card">
      <div class="card-head"><h3>Servicios</h3></div>
      <p class="lede">Los precios y los enlaces de pago de Clover se editan aquí y
        se reflejan en el portal del paciente.</p>
      ${services.map((s) => `<div class="row">
        <div class="main"><b>${esc(s.name)}</b>
          <span>${esc(s.description || "")} · ${s.minutes} min</span></div>
        <span class="pill">${money(s.price_cents)}</span>
        <span class="pill ${s.clover_link ? "done" : "warn"}">${
          s.clover_link ? "Clover ✓" : "Sin Clover"}</span>
        <button class="btn secondary sm" data-svc="${esc(s.id)}">Editar</button>
      </div>`).join("")}
    </div>`;
  wireNav();
  $$("[data-svc]").forEach((b) => b.onclick = () => {
    const s = services.find((x) => x.id === b.dataset.svc);
    editService(s);
  });
}

async function editService(s) {
  openModal(`
    <h3>${esc(s.name)}</h3>
    <div class="field"><label for="s-price">Precio (USD)</label>
      <input id="s-price" type="number" min="0" step="1" value="${Math.round(s.price_cents/100)}"></div>
    <div class="field"><label for="s-mins">Duración (minutos)</label>
      <input id="s-mins" type="number" min="5" step="5" value="${s.minutes}"></div>
    <div class="field"><label for="s-clover">Enlace de pago de Clover</label>
      <input id="s-clover" type="url" value="${esc(s.clover_link || "")}"
             placeholder="https://…">
      <span class="hint">Créalo en tu panel de Clover y pégalo aquí. Sin enlace,
        el paciente ve “Pagar en clínica”.</span></div>
    <div class="modal-actions">
      <button class="btn secondary" data-x>Cancelar</button>
      <button class="btn" id="s-save">Guardar</button>
    </div>`);
  $$("[data-x]").forEach((b) => b.onclick = closeModal);
  $("#s-save").onclick = async () => {
    const btn = $("#s-save"); btn.disabled = true; btn.textContent = "Guardando…";
    try {
      await api.saveService(s.id, {
        price_cents: Math.round(Number($("#s-price").value) * 100),
        minutes: Number($("#s-mins").value),
        clover_link: $("#s-clover").value.trim() || null
      });
      closeModal(); toast("Servicio actualizado."); route();
    } catch (e) {
      toast("No se pudo guardar: " + e.message, "err");
      btn.disabled = false; btn.textContent = "Guardar";
    }
  };
}
</script>
</body>
</html>
